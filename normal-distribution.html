<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Normal Distribution Explorer</title>

<style>
:root{
  --magenta:#9c1458;
  --blue:#1565c0;
  --text:#202124;
  --muted:#667085;
  --border:#e4e7ec;
  --soft:#f8f9fb;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f6f8;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
}

.app{
  width:min(880px,94vw);
  margin:24px auto;
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 8px 28px rgba(0,0,0,.07);
  padding:22px 28px 18px;
}

h1{
  margin:0;
  text-align:center;
  font-size:25px;
  color:var(--magenta);
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin:6px 0 18px;
}

/* CONTROL PANEL */
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:14px;
}

.control{
  border:1px solid var(--border);
  background:var(--soft);
  border-radius:12px;
  padding:12px 15px;
}

.control-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-weight:700;
}

.number{
  color:var(--magenta);
  background:white;
  border:1px solid #ddd;
  border-radius:7px;
  min-width:58px;
  text-align:center;
  padding:5px 8px;
  font-size:16px;
}

.adjuster{
  display:grid;
  grid-template-columns:36px 1fr 36px;
  align-items:center;
  gap:10px;
}

button{
  width:36px;
  height:32px;
  border:1px solid #d0d5dd;
  border-radius:7px;
  background:#fff;
  font-size:20px;
  cursor:pointer;
  color:var(--magenta);
  transition:.15s;
}

button:hover{
  background:var(--magenta);
  color:white;
  border-color:var(--magenta);
}

/* PROFESSIONAL RANGE */
input[type=range]{
  width:100%;
  height:5px;
  appearance:none;
  background:#d9dde4;
  border-radius:10px;
  outline:none;
}

input[type=range]::-webkit-slider-thumb{
  appearance:none;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#fff;
  border:4px solid var(--magenta);
  cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}

input[type=range]::-moz-range-thumb{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#fff;
  border:4px solid var(--magenta);
  cursor:pointer;
}

/* GRAPH */
.graph-wrap{
  position:relative;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:white;
}

canvas{
  display:block;
  width:100%;
  height:340px;
}

.distribution{
  position:absolute;
  top:13px;
  left:16px;
  background:rgba(255,255,255,.92);
  padding:6px 10px;
  border-radius:7px;
  font-family:Georgia,serif;
  font-size:17px;
  font-weight:bold;
}

/* KEY IDEA */
.key{
  display:flex;
  justify-content:center;
  gap:32px;
  margin-top:15px;
  font-size:14px;
}

.key span{
  display:flex;
  align-items:center;
  gap:7px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.magenta{background:var(--magenta)}
.blue{background:var(--blue)}

.message{
  text-align:center;
  margin-top:11px;
  font-size:14px;
  color:#475467;
}

.message strong{color:var(--magenta)}

@media(max-width:650px){
  .controls{grid-template-columns:1fr}
  .app{padding:16px}
  canvas{height:300px}
  .key{gap:14px;flex-wrap:wrap}
}
</style>
</head>

<body>

<div class="app">

<h1>Normal Distribution Explorer</h1>

<div class="subtitle">
Change μ and σ and observe how the distribution responds.
</div>

<div class="controls">

  <div class="control">
    <div class="control-head">
      <span>Mean (μ)</span>
      <span class="number" id="meanValue">0.0</span>
    </div>

    <div class="adjuster">
      <button onclick="changeMean(-0.5)">−</button>

      <input id="meanSlider"
             type="range"
             min="-5"
             max="5"
             step="0.1"
             value="0">

      <button onclick="changeMean(0.5)">+</button>
    </div>
  </div>


  <div class="control">
    <div class="control-head">
      <span>Standard deviation (σ)</span>
      <span class="number" id="sdValue">1.0</span>
    </div>

    <div class="adjuster">
      <button onclick="changeSD(-0.1)">−</button>

      <input id="sdSlider"
             type="range"
             min="0.3"
             max="3"
             step="0.1"
             value="1">

      <button onclick="changeSD(0.1)">+</button>
    </div>
  </div>

</div>


<div class="graph-wrap">

  <div class="distribution" id="distribution">
    X ~ N(0, 1)
  </div>

  <canvas id="graph"></canvas>

</div>


<div class="key">
  <span>
    <i class="dot blue"></i>
    μ controls the <strong>centre</strong>
  </span>

  <span>
    <i class="dot magenta"></i>
    σ controls the <strong>spread</strong>
  </span>
</div>

<div class="message" id="message">
Move <strong>μ</strong> to shift the curve.
Change <strong>σ</strong> to make it narrower/taller or wider/flatter.
</div>

</div>


<script>
const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");

const meanSlider = document.getElementById("meanSlider");
const sdSlider = document.getElementById("sdSlider");

const meanValue = document.getElementById("meanValue");
const sdValue = document.getElementById("sdValue");
const distribution = document.getElementById("distribution");

function pdf(x,mu,sigma){
  return 1/(sigma*Math.sqrt(2*Math.PI)) *
  Math.exp(-0.5*Math.pow((x-mu)/sigma,2));
}

function changeMean(amount){
  let x=parseFloat(meanSlider.value)+amount;
  x=Math.max(-5,Math.min(5,x));
  meanSlider.value=x;
  draw();
}

function changeSD(amount){
  let x=parseFloat(sdSlider.value)+amount;
  x=Math.max(.3,Math.min(3,x));
  sdSlider.value=x;
  draw();
}

function resize(){
  const r=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio || 1;

  canvas.width=r.width*dpr;
  canvas.height=r.height*dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);

  draw();
}

function draw(){

  const W=canvas.clientWidth;
  const H=canvas.clientHeight;

  ctx.clearRect(0,0,W,H);

  const mu=parseFloat(meanSlider.value);
  const sigma=parseFloat(sdSlider.value);

  meanValue.textContent=mu.toFixed(1);
  sdValue.textContent=sigma.toFixed(1);

  distribution.innerHTML =
    "X ~ N(" +
    mu.toFixed(1) +
    ", " +
    (sigma*sigma).toFixed(2) +
    ")";

  const L=48;
  const R=22;
  const T=30;
  const B=42;

  const gw=W-L-R;
  const gh=H-T-B;

  const xmin=-8;
  const xmax=8;

  /*
    Fixed vertical scale.
    This is important because students can actually
    SEE the height changing when σ changes.
  */
  const ymax=1.4;

  const xp=x =>
    L+(x-xmin)/(xmax-xmin)*gw;

  const yp=y =>
    T+gh-(y/ymax)*gh;


  /* vertical grid */
  ctx.strokeStyle="#f0f1f3";
  ctx.lineWidth=1;

  for(let x=-8;x<=8;x+=1){
    ctx.beginPath();
    ctx.moveTo(xp(x),T);
    ctx.lineTo(xp(x),T+gh);
    ctx.stroke();
  }


  /* x-axis */
  ctx.strokeStyle="#667085";
  ctx.lineWidth=1.2;

  ctx.beginPath();
  ctx.moveTo(L,T+gh);
  ctx.lineTo(L+gw,T+gh);
  ctx.stroke();


  /* x labels */
  ctx.fillStyle="#667085";
  ctx.font="11px Arial";
  ctx.textAlign="center";

  for(let x=-8;x<=8;x+=2){
    ctx.fillText(x,xp(x),T+gh+20);
  }


  /* shaded area */
  ctx.beginPath();
  ctx.moveTo(xp(xmin),yp(0));

  for(let x=xmin;x<=xmax;x+=.015){
    ctx.lineTo(xp(x),yp(pdf(x,mu,sigma)));
  }

  ctx.lineTo(xp(xmax),yp(0));
  ctx.closePath();

  ctx.fillStyle="rgba(156,20,88,.09)";
  ctx.fill();


  /* curve */
  ctx.beginPath();

  let first=true;

  for(let x=xmin;x<=xmax;x+=.015){

    const X=xp(x);
    const Y=yp(pdf(x,mu,sigma));

    if(first){
      ctx.moveTo(X,Y);
      first=false;
    }else{
      ctx.lineTo(X,Y);
    }
  }

  ctx.strokeStyle="#9c1458";
  ctx.lineWidth=3;
  ctx.stroke();


  /* mean line */
  const mx=xp(mu);
  const peak=yp(pdf(mu,mu,sigma));

  ctx.save();

  ctx.setLineDash([5,5]);
  ctx.strokeStyle="#1565c0";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(mx,T+gh);
  ctx.lineTo(mx,peak);
  ctx.stroke();

  ctx.restore();


  /* mean label */
  ctx.fillStyle="#1565c0";
  ctx.font="bold 15px Arial";
  ctx.fillText("μ",mx,T+gh+37);


  /* sigma markers */
  ctx.strokeStyle="#9c1458";
  ctx.lineWidth=2;

  [mu-sigma,mu+sigma].forEach(x=>{

    const px=xp(x);

    ctx.beginPath();
    ctx.moveTo(px,T+gh-5);
    ctx.lineTo(px,T+gh+5);
    ctx.stroke();

  });


  ctx.fillStyle="#9c1458";
  ctx.font="bold 11px Arial";

  ctx.fillText(
    "μ − σ",
    xp(mu-sigma),
    T+gh-10
  );

  ctx.fillText(
    "μ + σ",
    xp(mu+sigma),
    T+gh-10
  );
}

meanSlider.addEventListener("input",draw);
sdSlider.addEventListener("input",draw);
window.addEventListener("resize",resize);

resize();
</script>

</body>
</html>
