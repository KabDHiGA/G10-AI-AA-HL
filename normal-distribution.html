<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Normal Distribution Explorer</title>

<style>
:root{
  --magenta:#9c1458;
  --blue:#1565c0;
  --text:#202124;
  --muted:#667085;
  --border:#e4e7ec;
  --soft:#f8f9fb;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f6f8;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
}

.app{
  width:min(880px,94vw);
  margin:24px auto;
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 8px 28px rgba(0,0,0,.07);
  padding:22px 28px 18px;
}

h1{
  margin:0;
  text-align:center;
  font-size:25px;
  color:var(--magenta);
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin:6px 0 18px;
}

/* CONTROL PANEL */
.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:14px;
}

.control{
  border:1px solid var(--border);
  background:var(--soft);
  border-radius:12px;
  padding:14px 15px;
}

.control-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-weight:700;
}

/* EDITABLE NUMBER INPUT */
.number-input{
  width:110px;
  color:var(--magenta);
  background:white;
  border:1px solid #d0d5dd;
  border-radius:7px;
  text-align:center;
  padding:6px 8px;
  font-size:16px;
  font-weight:700;
  outline:none;
}

.number-input:focus{
  border-color:var(--magenta);
  box-shadow:0 0 0 3px rgba(156,20,88,.10);
}

.adjuster{
  display:grid;
  grid-template-columns:36px 1fr 36px;
  align-items:center;
  gap:10px;
}

button{
  width:36px;
  height:32px;
  border:1px solid #d0d5dd;
  border-radius:7px;
  background:#fff;
  font-size:20px;
  cursor:pointer;
  color:var(--magenta);
  transition:.15s;
}

button:hover{
  background:var(--magenta);
  color:white;
  border-color:var(--magenta);
}

input[type=range]{
  width:100%;
  height:5px;
  appearance:none;
  background:#d9dde4;
  border-radius:10px;
  outline:none;
}

input[type=range]::-webkit-slider-thumb{
  appearance:none;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#fff;
  border:4px solid var(--magenta);
  cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}

input[type=range]::-moz-range-thumb{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#fff;
  border:4px solid var(--magenta);
  cursor:pointer;
}

/* GRAPH */
.graph-wrap{
  position:relative;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  background:white;
}

canvas{
  display:block;
  width:100%;
  height:340px;
}

.distribution{
  position:absolute;
  top:13px;
  left:16px;
  background:rgba(255,255,255,.92);
  padding:6px 10px;
  border-radius:7px;
  font-family:Georgia,serif;
  font-size:17px;
  font-weight:bold;
}

.key{
  display:flex;
  justify-content:center;
  gap:32px;
  margin-top:15px;
  font-size:14px;
}

.key span{
  display:flex;
  align-items:center;
  gap:7px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.magenta{background:var(--magenta)}
.blue{background:var(--blue)}

.message{
  text-align:center;
  margin-top:11px;
  font-size:14px;
  color:#475467;
}

.message strong{color:var(--magenta)}

@media(max-width:650px){
  .controls{grid-template-columns:1fr}
  .app{padding:16px}
  canvas{height:300px}
  .key{gap:14px;flex-wrap:wrap}
}
</style>
</head>

<body>

<div class="app">

<h1>Normal Distribution Explorer</h1>

<div class="subtitle">
Enter any mean μ and standard deviation σ and observe how the distribution responds.
</div>

<div class="controls">

  <!-- MEAN -->
  <div class="control">

    <div class="control-head">
      <span>Mean (μ)</span>

      <input
        class="number-input"
        id="meanInput"
        type="number"
        step="1"
        value="170">
    </div>

    <div class="adjuster">

      <button onclick="changeMean(-1)">−</button>

      <input
        id="meanSlider"
        type="range"
        min="120"
        max="220"
        step="1"
        value="170">

      <button onclick="changeMean(1)">+</button>

    </div>

  </div>


  <!-- STANDARD DEVIATION -->
  <div class="control">

    <div class="control-head">

      <span>Standard deviation (σ)</span>

      <input
        class="number-input"
        id="sdInput"
        type="number"
        min="0.01"
        step="1"
        value="10">

    </div>

    <div class="adjuster">

      <button onclick="changeSD(-1)">−</button>

      <input
        id="sdSlider"
        type="range"
        min="1"
        max="50"
        step="1"
        value="10">

      <button onclick="changeSD(1)">+</button>

    </div>

  </div>

</div>


<div class="graph-wrap">

  <div class="distribution" id="distribution">
    X ~ N(170, 10²)
  </div>

  <canvas id="graph"></canvas>

</div>


<div class="key">

  <span>
    <i class="dot blue"></i>
    μ controls the <strong>centre</strong>
  </span>

  <span>
    <i class="dot magenta"></i>
    σ controls the <strong>spread</strong>
  </span>

</div>


<div class="message">
Type your own values for <strong>μ</strong> and <strong>σ</strong>.
The graph automatically adjusts its scale.
</div>

</div>


<script>

const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");

const meanSlider = document.getElementById("meanSlider");
const sdSlider = document.getElementById("sdSlider");

const meanInput = document.getElementById("meanInput");
const sdInput = document.getElementById("sdInput");

const distribution = document.getElementById("distribution");


function pdf(x,mu,sigma){

  return 1/(sigma*Math.sqrt(2*Math.PI)) *
  Math.exp(
    -0.5*Math.pow((x-mu)/sigma,2)
  );

}


/* -------------------------
   MEAN CONTROLS
-------------------------- */

function changeMean(amount){

  let mu =
    parseFloat(meanInput.value);

  if(!Number.isFinite(mu)) mu=0;

  mu += amount;

  meanInput.value =
    Number(mu.toFixed(4));

  updateMeanSlider(mu);

  draw();
}


function updateMeanSlider(mu){

  /*
  The slider automatically follows
  values outside its current range.
  */

  let min =
    parseFloat(meanSlider.min);

  let max =
    parseFloat(meanSlider.max);

  const span = Math.max(
    max-min,
    10
  );

  if(mu <= min){

    meanSlider.min =
      Math.floor(mu-span/2);

  }

  if(mu >= max){

    meanSlider.max =
      Math.ceil(mu+span/2);

  }

  meanSlider.value=mu;
}


/* -------------------------
   STANDARD DEVIATION
-------------------------- */

function changeSD(amount){

  let sigma =
    parseFloat(sdInput.value);

  if(!Number.isFinite(sigma))
    sigma=1;

  sigma += amount;

  if(sigma<=0)
    sigma=0.1;

  sdInput.value =
    Number(sigma.toFixed(4));

  updateSDSlider(sigma);

  draw();
}


function updateSDSlider(sigma){

  if(sigma >
     parseFloat(sdSlider.max)){

    sdSlider.max =
      Math.ceil(sigma*1.5);

  }

  sdSlider.value=sigma;
}


/* -------------------------
   INPUT EVENTS
-------------------------- */

meanInput.addEventListener(
  "input",
  function(){

    const mu =
      parseFloat(this.value);

    if(Number.isFinite(mu)){

      updateMeanSlider(mu);
      draw();

    }

  }
);


sdInput.addEventListener(
  "input",
  function(){

    const sigma =
      parseFloat(this.value);

    if(
      Number.isFinite(sigma)
      &&
      sigma>0
    ){

      updateSDSlider(sigma);
      draw();

    }

  }
);


meanSlider.addEventListener(
  "input",
  function(){

    meanInput.value =
      this.value;

    draw();

  }
);


sdSlider.addEventListener(
  "input",
  function(){

    sdInput.value =
      this.value;

    draw();

  }
);


/* -------------------------
   RESIZE
-------------------------- */

function resize(){

  const r =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    r.width*dpr;

  canvas.height =
    r.height*dpr;

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  draw();
}


/* -------------------------
   NICE AXIS INTERVAL
-------------------------- */

function niceStep(range){

  const rough =
    range/8;

  const power =
    Math.pow(
      10,
      Math.floor(
        Math.log10(rough)
      )
    );

  const value =
    rough/power;

  let nice;

  if(value<1.5)
    nice=1;

  else if(value<3)
    nice=2;

  else if(value<7)
    nice=5;

  else
    nice=10;

  return nice*power;
}


/* -------------------------
   DRAW GRAPH
-------------------------- */

function draw(){

  const W =
    canvas.clientWidth;

  const H =
    canvas.clientHeight;

  ctx.clearRect(
    0,0,W,H
  );


  let mu =
    parseFloat(
      meanInput.value
    );

  let sigma =
    parseFloat(
      sdInput.value
    );


  if(!Number.isFinite(mu))
    return;

  if(
    !Number.isFinite(sigma)
    ||
    sigma<=0
  )
    return;


  /* DISTRIBUTION DISPLAY */

  const variance =
    sigma*sigma;

  distribution.innerHTML =
    "X ~ N(" +
    formatNumber(mu) +
    ", " +
    formatNumber(variance) +
    ")";


  const L=55;
  const R=25;
  const T=35;
  const B=48;

  const gw=W-L-R;
  const gh=H-T-B;


  /*
  --------------------------------
  AUTOMATIC HORIZONTAL SCALE

  The graph always displays
  approximately μ ± 4σ.
  --------------------------------
  */

  const xmin =
    mu - 4*sigma;

  const xmax =
    mu + 4*sigma;


  /*
  Automatic vertical scale.
  */

  const peak =
    pdf(mu,mu,sigma);

  const ymax =
    peak*1.18;


  const xp = x =>
    L+
    (x-xmin)/
    (xmax-xmin)*
    gw;


  const yp = y =>
    T+
    gh-
    (y/ymax)*gh;


  /* ----------------
     GRID + LABELS
  ---------------- */

  const step =
    niceStep(
      xmax-xmin
    );

  const firstTick =
    Math.ceil(
      xmin/step
    )*step;


  ctx.strokeStyle="#f0f1f3";
  ctx.lineWidth=1;

  ctx.fillStyle="#667085";
  ctx.font="11px Arial";
  ctx.textAlign="center";


  for(
    let x=firstTick;
    x<=xmax+step*.001;
    x+=step
  ){

    const px=xp(x);

    ctx.beginPath();

    ctx.moveTo(
      px,T
    );

    ctx.lineTo(
      px,T+gh
    );

    ctx.stroke();


    ctx.fillText(
      formatNumber(x),
      px,
      T+gh+21
    );

  }


  /* X AXIS */

  ctx.strokeStyle="#667085";
  ctx.lineWidth=1.2;

  ctx.beginPath();

  ctx.moveTo(
    L,T+gh
  );

  ctx.lineTo(
    L+gw,T+gh
  );

  ctx.stroke();


  /* ----------------
     SHADED CURVE
  ---------------- */

  ctx.beginPath();

  ctx.moveTo(
    xp(xmin),
    yp(0)
  );


  const samples=700;

  for(
    let i=0;
    i<=samples;
    i++
  ){

    const x =
      xmin +
      i/samples*
      (xmax-xmin);

    ctx.lineTo(
      xp(x),
      yp(
        pdf(
          x,
          mu,
          sigma
        )
      )
    );

  }


  ctx.lineTo(
    xp(xmax),
    yp(0)
  );

  ctx.closePath();

  ctx.fillStyle =
    "rgba(156,20,88,.09)";

  ctx.fill();


  /* ----------------
     NORMAL CURVE
  ---------------- */

  ctx.beginPath();

  for(
    let i=0;
    i<=samples;
    i++
  ){

    const x =
      xmin +
      i/samples*
      (xmax-xmin);

    const X=xp(x);

    const Y=
      yp(
        pdf(
          x,
          mu,
          sigma
        )
      );


    if(i===0)
      ctx.moveTo(X,Y);

    else
      ctx.lineTo(X,Y);

  }


  ctx.strokeStyle="#9c1458";
  ctx.lineWidth=3;

  ctx.stroke();


  /* ----------------
     MEAN
  ---------------- */

  const mx=xp(mu);

  const peakY =
    yp(
      pdf(
        mu,
        mu,
        sigma
      )
    );


  ctx.save();

  ctx.setLineDash([5,5]);

  ctx.strokeStyle="#1565c0";

  ctx.lineWidth=2;


  ctx.beginPath();

  ctx.moveTo(
    mx,
    T+gh
  );

  ctx.lineTo(
    mx,
    peakY
  );

  ctx.stroke();

  ctx.restore();


  /* μ LABEL */

  ctx.fillStyle="#1565c0";
  ctx.font="bold 15px Arial";

  ctx.fillText(
    "μ",
    mx,
    T+gh+39
  );


  /* ----------------
     SIGMA MARKERS
  ---------------- */

  ctx.strokeStyle="#9c1458";
  ctx.lineWidth=2;


  [
    mu-sigma,
    mu+sigma
  ].forEach(x=>{

    const px=xp(x);

    ctx.beginPath();

    ctx.moveTo(
      px,
      T+gh-5
    );

    ctx.lineTo(
      px,
      T+gh+5
    );

    ctx.stroke();

  });


  ctx.fillStyle="#9c1458";
  ctx.font="bold 11px Arial";


  ctx.fillText(
    "μ − σ",
    xp(mu-sigma),
    T+gh-11
  );


  ctx.fillText(
    "μ + σ",
    xp(mu+sigma),
    T+gh-11
  );

}


/* -------------------------
   NUMBER FORMATTING
-------------------------- */

function formatNumber(x){

  if(
    Math.abs(x)>=10000
    ||
    (
      Math.abs(x)>0
      &&
      Math.abs(x)<0.01
    )
  ){

    return x.toExponential(2);

  }


  return Number(
    x.toFixed(2)
  ).toString();

}


window.addEventListener(
  "resize",
  resize
);

resize();

</script>

</body>
</html>
